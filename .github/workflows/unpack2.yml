name: Распаковка проекта

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check archive
        run: |
          ls -la
          test -f caillou-android-project.zip

      - name: Unpack project
        run: |
          mkdir -p extracted
          unzip -o caillou-android-project.zip -d extracted
          cp -a extracted/caillou-android/. .
          rm -rf extracted
          rm caillou-android-project.zip

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Распаковка Android-проекта" || echo "No changes"
          git push
