name: Unpack

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o caillou-android-project.zip
          cp -a caillou-android/. .
          rm -rf caillou-android
          rm caillou-android-project.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "unpack" || true
          git push
