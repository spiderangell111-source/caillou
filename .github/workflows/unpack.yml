name: Распаковка проекта

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы
        uses: actions/checkout@v4

      - name: Распаковать архив
        run: |
          unzip -o caillou-android-project.zip -d .
          rm caillou-android-project.zip

      - name: Сохранить распакованный проект
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Распаковка Android-проекта" || echo "Нет изменений"
          git push
